version: "3.8"
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_TARGET: server
    image: vaijunto-server:local
    ports:
      - "5000:5000"
    environment:
      SERVER_PORT: "5000"
      LISTEN_HOST: "0.0.0.0"
      DATA_PATH: /data/state.json
    volumes:
      - vaijunto-data:/data

volumes:
  vaijunto-data:
